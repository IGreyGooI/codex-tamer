[package]
name = "codex-tamer"
version = "0.2.4"
edition = "2024"
license = "MIT"
description = "Headless Agent-facing CLI for querying and controlling Codex app-server threads"
repository = "https://github.com/IGreyGooI/codex-tamer"
publish = false

[[bin]]
name = "codex-tamer"
path = "src/bin/codex-tamer.rs"

[dependencies]
anyhow = "1.0.100"
blake3 = "1"
chrono = { version = "0.4.42", default-features = false, features = ["clock", "std"] }
clap = { version = "4.5.53", features = ["derive", "env"] }
fd-lock = "4.0.4"
futures-util = "0.3.32"
libc = "0.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["macros", "net", "rt-multi-thread", "signal", "time"] }
tokio-tungstenite = { version = "0.29", features = ["native-tls"] }
toml = "0.9.8"
url = "2.5.7"

[dev-dependencies]
assert_cmd = "2.1.1"
predicates = "3.1.3"
tempfile = "3.23.0"
