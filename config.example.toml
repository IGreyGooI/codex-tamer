# Global defaults for new threads. Follow-up `send` commands keep the
# thread's existing app-server settings unless --model or --effort is passed.
model = "gpt-5.5"
model_reasoning_effort = "high"

# Optional Unix managed-listener overrides. Without configured servers,
# codex-tamer serves CODEX_HOME (or ~/.codex) through one private shared socket.
# [managed]
# codex = "/absolute/path/to/codex"
# codex_home = "/absolute/path/to/.codex"

[servers.main]
endpoint = "unix:///path/to/codex.sock"

# Disabled by default. When true, `usage redeem` may redeem the best available
# detailed Codex rate-limit reset credit for this server.
# allow_rate_limit_reset = true

# Optional per-server overrides.
# [servers.work]
# endpoint = "ws://127.0.0.1:8765"
# auth_token_env = "CODEX_APP_SERVER_TOKEN"
# model = "gpt-5.5"
# model_reasoning_effort = "low"
